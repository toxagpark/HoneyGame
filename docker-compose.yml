services:
  honey_postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp_env_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

  honey_postgres_migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port_forwarder:
    image: alpine/socat:1.8.0.3
    container_name: honey_pg_port_forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:honey_postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data: